name: GitHub Pages

# Publishes this repo's static build to GitHub Pages.
# Does not deploy soulridemk.lovable.app or soulridemk.vercel.app.
on:
  push:
    branches:
      - main
      - cursor/repo-hygiene-ci-2110
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Project site: https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          export VITE_SUPABASE_URL="${VITE_SUPABASE_URL:-https://example.supabase.co}"
          export VITE_SUPABASE_PUBLISHABLE_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY:-public-anon-key-placeholder}"
          export VITE_SUPABASE_PROJECT_ID="${VITE_SUPABASE_PROJECT_ID:-local-project-id}"
          npm run build
          test -f dist/404.html
          grep -q "/${GITHUB_REPOSITORY#*/}/assets/" dist/index.html
          grep -q "/${GITHUB_REPOSITORY#*/}/assets/" dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
